name: Develop Branch CI

on:
  push:
    branches:
      - develop

jobs:
  verify:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.1.3 # package.json packageManager 버전과 동기화

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Type Check
        run: pnpm check

      - name: Run Code Linter
        run: pnpm lint

      - name: Build Application
        run: pnpm build
